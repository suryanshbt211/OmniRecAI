services:

  postgres:

    image: postgres:16

    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni123
      POSTGRES_DB: omnirec

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:

    image: redis:7

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  api:

    build: .

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis


volumes:

  postgres_data:

  redis_data: